# Nginx configuration for LaptopMart Myanmar
# Place this file in /etc/nginx/sites-available/laptopmart and symlink to sites-enabled

upstream laptopmart_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;  # Change to your domain in production

    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Static files
    location /static/ {
        alias C:\CyberOptix v0.1\LaptopMart Myanmar v0.1\inferno\staticfiles;  # Update this path
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias C:\CyberOptix v0.1\LaptopMart Myanmar v0.1\inferno\media;  # Update this path
        expires 1y;
        add_header Cache-Control "public";
    }

    # Main application
    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        # If the file exists as a static file, serve it directly
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://laptopmart_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

# Optional: Redirect HTTP to HTTPS (uncomment when you have SSL)
