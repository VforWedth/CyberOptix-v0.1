<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Canceled - KBZPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .cancel-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .cancel-icon {
            width: 80px;
            height: 80px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .cancel-x {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }
        .cancel-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .cancel-message {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .btn-close {
            background: #6c757d;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-close:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="cancel-container">
        <div class="cancel-icon">
            <svg class="cancel-x" viewBox="0 0 52 52">
                <path d="M16 16 L36 36 M36 16 L16 36" />
            </svg>
        </div>

        <h1 class="cancel-title">Payment Canceled</h1>
        <p class="cancel-message">Your payment has been canceled. No charges were made.</p>

        <button class="btn-close" onclick="window.close()">Close Window</button>
    </div>

    <script>
        // Notify parent window
        if (window.opener) {
            window.opener.postMessage({
                type: 'kbzpay_canceled',
                data: {
                    prepay_id: '{{ transaction.prepay_id }}',
                    out_trade_no: '{{ transaction.out_trade_no }}',
                    status: 'TRADE_CANCELED'
                }
            }, '*');
        }
    </script>
</body>
</html>
