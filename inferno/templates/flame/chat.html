<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Chatbot Icon</title>
<style>
  body {
    margin: 0;
    height: 200vh; /* Just for testing scrolling */
    background-color: #f2f2f2;
    font-family: Arial, sans-serif;
  }

  /* Floating Circle Button */
  #chatbot-circle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background-color: #0084ff;
    border-radius: 50%;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    cursor: grab;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 30px;
    transition: transform 0.2s ease;
  }

  #chatbot-circle:active {
    cursor: grabbing;
    transform: scale(1.05);
  }

  /* Chat Page Modal */
  #chatbot-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
  }

  #chatbot-content {
    width: 400px;
    height: 500px;
    background: white;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }

  #close-btn {
    display: block;
    margin-left: auto;
    padding: 5px 10px;
    background: #0084ff;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
  <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #eef2f3, #f9f9f9);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            margin: 40px 0 20px;
            color: #333;
        }

        #chatbox {
            width: 90%;
            max-width: 700px;
            height: 450px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .user, .bot {
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-in-out;
        }

        .user {
            background-color: #d1ecf1;
            color: #0c5460;
            align-self: flex-end;
        }

        .bot {
            background-color: #f1f1f1;
            color: #333;
            align-self: flex-start;
        }

        #input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90%;
            max-width: 700px;
            margin: 15px 0 40px;
        }

        #message {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            margin-right: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Floating Chat Button -->
<div id="chatbot-circle">💬</div>

<!-- Chat Page Modal -->
<div id="chatbot-page">
  <div id="chatbot-content">
    <button id="close-btn">Close</button>
     <div id="chatbox"></div>
    <div id="input-area">
        <input type="text" id="message" placeholder="Say something...">
        <button onclick="send()">Send</button>
    </div>
</div>
</div>
 <script>
        function send() {
            const input = document.getElementById("message");
            const text = input.value.trim();
            if (!text) return;

            const chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class="user">${text}</div>`;
            input.value = "";
            chatbox.scrollTop = chatbox.scrollHeight;

            fetch(`/chatbot-reply?message=${encodeURIComponent(text)}`)
                .then(res => res.json())
                .then(data => {
                    chatbox.innerHTML += `<div class="bot">${data.response}</div>`;
                    chatbox.scrollTop = chatbox.scrollHeight;
                })
                .catch(error => {
                    chatbox.innerHTML += `<div class="bot">Error: Couldn't get response</div>`;
                    chatbox.scrollTop = chatbox.scrollHeight;
                    console.error("Error fetching response:", error);
                });
        }

        // Optional: allow Enter key to send
        document.getElementById("message").addEventListener("keypress", function(event) {
            if (event.key === "Enter") send();
        });
    </script>
<script>
  const chatbotCircle = document.getElementById('chatbot-circle');
  const chatbotPage = document.getElementById('chatbot-page');
  const closeBtn = document.getElementById('close-btn');

  let offsetX = 0, offsetY = 0, isDragging = false;

  // Open chatbot page
  chatbotCircle.addEventListener('click', () => {
    if (!isDragging) {
      chatbotPage.style.display = 'flex';
    }
  });

  // Close chatbot page
  closeBtn.addEventListener('click', () => {
    chatbotPage.style.display = 'none';
  });

  // Dragging logic
  chatbotCircle.addEventListener('mousedown', (e) => {
    isDragging = false;
    offsetX = e.clientX - chatbotCircle.getBoundingClientRect().left;
    offsetY = e.clientY - chatbotCircle.getBoundingClientRect().top;
    document.addEventListener('mousemove', moveCircle);
    document.addEventListener('mouseup', stopDragging);
  });

  function moveCircle(e) {
    isDragging = true;
    chatbotCircle.style.left = (e.clientX - offsetX) + 'px';
    chatbotCircle.style.top = (e.clientY - offsetY) + 'px';
    chatbotCircle.style.right = 'auto'; // Remove fixed right
    chatbotCircle.style.bottom = 'auto'; // Remove fixed bottom
  }

  function stopDragging() {
    document.removeEventListener('mousemove', moveCircle);
    document.removeEventListener('mouseup', stopDragging);
    setTimeout(() => (isDragging = false), 100);
  }
</script>

</body>
</html>
