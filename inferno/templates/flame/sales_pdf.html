<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Report</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        h1, h2, h3 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #000; padding: 6px; text-align: center; }
    </style>
</head>
<body>
    <h1>Sales Report</h1>
<a href="{% url 'flame:sales_pdf' %}" class="btn btn-primary" target="_blank">
    Download PDF
</a>

    <h2>Total Sales: {{ total_sales }}</h2>
    <h2>Total Orders: {{ sales_count }}</h2>

    <h3>Top Products</h3>
    <table>
        <tr>
            <th>Product</th>
            <th>Quantity Sold</th>
        </tr>
        {% for product in top_products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.quantity_sold }}</td>
        </tr>
        {% endfor %}
    </table>

    <h3>Monthly Sales</h3>
    <table>
        <tr>
            <th>Month</th>
            <th>Total Sales</th>
            <th>Orders</th>
        </tr>
    
    </table>
</body>
</html>
